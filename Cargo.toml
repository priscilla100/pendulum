# Workspace manifest for Pendulum's symbolic substrate.
#
# Members:
#   - `rust`        : pltl_rust — the LTL/PLTL AST and analyses.
#   - `mcp/shared`  : pltl_mcp_shared — parse-via-ocaml glue, server scaffolding, LRU cache.
#   - `mcp/server`  : `pltl-mcp` — the 14-tool MCP server Pendulum's Python
#                     pipeline talks to over stdio.

[workspace]
resolver = "2"
members  = [
    "rust",
    "mcp/shared",
    "mcp/server",
]

[workspace.dependencies]
serde       = { version = "1.0.228", features = ["derive"] }
serde_json  = "1.0.140"
thiserror   = "2.0.18"
anyhow      = "1.0.100"
async-trait = "0.1.89"
clap        = { version = "4.6.0", features = ["derive", "env"] }
schemars    = "1.2.1"
lru         = "0.12.5"
futures     = "0.3.31"
tokio       = { version = "1.52.1", features = ["full"] }

tracing            = "0.1.40"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }

reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls", "stream"] }

rmcp = { version = "1.7.0", default-features = false }

pltl_rust       = { path = "rust" }
pltl_mcp_shared = { path = "mcp/shared" }

[profile.release]
lto       = "thin"
codegen-units = 1
strip     = "debuginfo"
